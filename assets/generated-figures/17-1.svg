<svg width="640" height="805" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 805" role="img" aria-label="发明专利的一般审批阶段。此图说明术语，不标记该申请已经走到哪一步。"><title>发明专利的一般审批阶段。此图说明术语，不标记该申请已经走到哪一步。</title><rect x="65" y="20" width="510" height="105" rx="7" fill="#e7eee3" /><text x="320" y="51" font-size="17" fill="#26786b" text-anchor="middle" font-weight="600" font-family="Segoe UI,Microsoft YaHei,sans-serif">递交申请</text><text x="320" y="88" font-size="14" fill="#687d70" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">申请材料进入专利审查程序</text><line x1="320" y1="130" x2="320" y2="147" stroke="#26786b" stroke-width="2" /><polygon points="320,147 316.0853101929989,138.8959760788259 323.9146898070011,138.8959760788259" fill="#26786b"/><rect x="65" y="152" width="510" height="105" rx="7" fill="#e7eee3" /><text x="320" y="183" font-size="17" fill="#26786b" text-anchor="middle" font-weight="600" font-family="Segoe UI,Microsoft YaHei,sans-serif">受理</text><text x="320" y="220" font-size="14" fill="#687d70" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">确认申请可被接收；仍非授权</text><line x1="320" y1="262" x2="320" y2="279" stroke="#26786b" stroke-width="2" /><polygon points="320,279 316.0853101929989,270.8959760788259 323.9146898070011,270.8959760788259" fill="#26786b"/><rect x="65" y="284" width="510" height="105" rx="7" fill="#e7eee3" /><text x="320" y="315" font-size="17" fill="#26786b" text-anchor="middle" font-weight="600" font-family="Segoe UI,Microsoft YaHei,sans-serif">初步审查</text><text x="320" y="352" font-size="14" fill="#687d70" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">核对进入后续程序的条件</text><line x1="320" y1="394" x2="320" y2="411" stroke="#26786b" stroke-width="2" /><polygon points="320,411 316.0853101929989,402.8959760788259 323.9146898070011,402.8959760788259" fill="#26786b"/><rect x="65" y="416" width="510" height="105" rx="7" fill="#e7eee3" /><text x="320" y="447" font-size="17" fill="#26786b" text-anchor="middle" font-weight="600" font-family="Segoe UI,Microsoft YaHei,sans-serif">申请公布</text><text x="320" y="484" font-size="14" fill="#687d70" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">公开申请文本；不等于权利已获授权</text><line x1="320" y1="526" x2="320" y2="543" stroke="#26786b" stroke-width="2" /><polygon points="320,543 316.0853101929989,534.8959760788259 323.9146898070011,534.8959760788259" fill="#26786b"/><rect x="65" y="548" width="510" height="105" rx="7" fill="#e7eee3" /><text x="320" y="579" font-size="17" fill="#26786b" text-anchor="middle" font-weight="600" font-family="Segoe UI,Microsoft YaHei,sans-serif">实质审查</text><text x="320" y="616" font-size="14" fill="#687d70" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">审查申请是否符合授权要求</text><line x1="320" y1="658" x2="320" y2="675" stroke="#26786b" stroke-width="2" /><polygon points="320,675 316.0853101929989,666.8959760788259 323.9146898070011,666.8959760788259" fill="#26786b"/><rect x="65" y="680" width="510" height="105" rx="7" fill="#e7eee3" /><text x="320" y="711" font-size="17" fill="#26786b" text-anchor="middle" font-weight="600" font-family="Segoe UI,Microsoft YaHei,sans-serif">审查结果</text><text x="320" y="748" font-size="14" fill="#687d70" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">可能授权，也可能驳回、撤回或其他结案</text></svg>