<svg width="640" height="245" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 245" role="img" aria-label="同均值不等于同分布：源点 0 必须把一半质量送到 −1，另一半送到 +1。均值差为零，但运输能看到分散程度的差异。"><title>同均值不等于同分布：源点 0 必须把一半质量送到 −1，另一半送到 +1。均值差为零，但运输能看到分散程度的差异。</title><text x="155" y="31" font-size="16" fill="#29433a" text-anchor="middle" font-weight="600" font-family="Segoe UI,Microsoft YaHei,sans-serif">全部质量位于 0</text><text x="485" y="31" font-size="16" fill="#29433a" text-anchor="middle" font-weight="600" font-family="Segoe UI,Microsoft YaHei,sans-serif">一半在 −1，一半在 +1</text><line x1="45" y1="170" x2="265" y2="170" stroke="#b7c9ba" stroke-width="2" /><line x1="45" y1="166" x2="45" y2="174" stroke="#b7c9ba" stroke-width="2" /><text x="45" y="195" font-size="14" fill="#687d70" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">−1</text><line x1="155" y1="166" x2="155" y2="174" stroke="#b7c9ba" stroke-width="2" /><text x="155" y="195" font-size="14" fill="#687d70" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">0</text><line x1="265" y1="166" x2="265" y2="174" stroke="#b7c9ba" stroke-width="2" /><text x="265" y="195" font-size="14" fill="#687d70" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">+1</text><line x1="375" y1="170" x2="595" y2="170" stroke="#b7c9ba" stroke-width="2" /><line x1="375" y1="166" x2="375" y2="174" stroke="#b7c9ba" stroke-width="2" /><text x="375" y="195" font-size="14" fill="#687d70" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">−1</text><line x1="485" y1="166" x2="485" y2="174" stroke="#b7c9ba" stroke-width="2" /><text x="485" y="195" font-size="14" fill="#687d70" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">0</text><line x1="595" y1="166" x2="595" y2="174" stroke="#b7c9ba" stroke-width="2" /><text x="595" y="195" font-size="14" fill="#687d70" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">+1</text><rect x="145" y="65" width="20" height="105" rx="7" fill="#26786b" /><text x="155" y="53" font-size="16" fill="#29433a" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">1</text><rect x="365" y="117.5" width="20" height="52.5" rx="7" fill="#d7834d" /><rect x="585" y="117.5" width="20" height="52.5" rx="7" fill="#d7834d" /><text x="375" y="105" font-size="16" fill="#29433a" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">1/2</text><text x="595" y="105" font-size="16" fill="#29433a" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">1/2</text><text x="320" y="220" font-size="16" fill="#26786b" text-anchor="middle" font-weight="600" font-family="Segoe UI,Microsoft YaHei,sans-serif">均值都为 0，但 W₁ = W₂ = 1</text></svg>