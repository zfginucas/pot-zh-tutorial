<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 268" role="img" aria-label="无计划熵正则时，最小化 p+ρKL(p|1)+ρKL(p|0.5)，得 p=√0.5·exp[−1/(2ρ)]。较大 ρ 下 p 可以超过参考目标质量 0.5，说明 KL 软约束并非“只能丢弃质量”的硬上界。"><title>无计划熵正则时，最小化 p+ρKL(p|1)+ρKL(p|0.5)，得 p=√0.5·exp[−1/(2ρ)]。较大 ρ 下 p 可以超过参考目标质量 0.5，说明 KL 软约束并非“只能丢弃质量”的硬上界。</title><text x="320" y="29" font-size="16" fill="#29433a" text-anchor="middle" font-weight="600" font-family="Segoe UI,Microsoft YaHei,sans-serif">单点例子：a=1，b=0.5，运输单位成本=1</text><line x1="65" y1="204" x2="590" y2="204" stroke="#b7c9ba" stroke-width="2" /><line x1="65" y1="121.5" x2="590" y2="121.5" stroke="#d7834d" stroke-width="2" stroke-dasharray="6 5"/><text x="583" y="103" font-size="14" fill="#d7834d" text-anchor="end" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">目标参考质量 0.5</text><rect x="130" y="203.21394" width="56" height="0.78606" rx="7" fill="#26786b" /><circle cx="158" cy="203.21394" r="3" fill="#26786b" /><text x="158" y="239" font-size="16" fill="#29433a" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">ρ=0.1</text><text x="158" y="182" font-size="15" fill="#29433a" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">p≈0.0048</text><rect x="399" y="93.017535" width="56" height="110.982465" rx="7" fill="#26786b" /><text x="427" y="239" font-size="16" fill="#29433a" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">ρ=10</text><text x="427" y="77" font-size="15" fill="#29433a" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">p≈0.6726</text></svg>