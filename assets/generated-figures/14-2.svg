<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 251" role="img" aria-label="普通泛化评估中，预处理在训练数据上拟合，超参数用验证集选择，测试集用于最终报告。无监督域适应或转导任务可能允许使用无标签目标特征，但不能据此使用目标测试标签调参。"><title>普通泛化评估中，预处理在训练数据上拟合，超参数用验证集选择，测试集用于最终报告。无监督域适应或转导任务可能允许使用无标签目标特征，但不能据此使用目标测试标签调参。</title><text x="320" y="28" font-size="16" fill="#29433a" text-anchor="middle" font-weight="600" font-family="Segoe UI,Microsoft YaHei,sans-serif">每种数据，只承担它应承担的职责</text><rect x="27" y="60" width="162" height="119" rx="7" fill="#e7eee3" /><text x="108" y="92" font-size="16" fill="#26786b" text-anchor="middle" font-weight="600" font-family="Segoe UI,Microsoft YaHei,sans-serif">训练集</text><text x="108" y="124" font-size="14" fill="#687d70" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">拟合预处理</text><text x="108" y="149" font-size="14" fill="#687d70" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">训练模型 / 耦合规则</text><line x1="200" y1="120" x2="229" y2="120" stroke="#26786b" stroke-width="2" /><polygon points="229,120 220.8959760788259,123.91468980700107 220.8959760788259,116.08531019299893" fill="#26786b"/><rect x="239" y="60" width="162" height="119" rx="7" fill="#e7eee3" /><text x="320" y="92" font-size="16" fill="#d7834d" text-anchor="middle" font-weight="600" font-family="Segoe UI,Microsoft YaHei,sans-serif">验证集</text><text x="320" y="124" font-size="14" fill="#687d70" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">选择 ε、α、方向数</text><text x="320" y="149" font-size="14" fill="#687d70" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">比较候选设置</text><line x1="412" y1="120" x2="441" y2="120" stroke="#26786b" stroke-width="2" /><polygon points="441,120 432.8959760788259,123.91468980700107 432.8959760788259,116.08531019299893" fill="#26786b"/><rect x="451" y="60" width="162" height="119" rx="7" fill="#e7eee3" /><text x="532" y="92" font-size="16" fill="#26786b" text-anchor="middle" font-weight="600" font-family="Segoe UI,Microsoft YaHei,sans-serif">测试集</text><text x="532" y="124" font-size="14" fill="#687d70" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">冻结设置后评估</text><text x="532" y="149" font-size="14" fill="#687d70" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">报告成功与失败</text><text x="320" y="223" font-size="15" fill="#687d70" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">转导式任务若允许使用无标签目标特征，应在协议中写明。</text></svg>