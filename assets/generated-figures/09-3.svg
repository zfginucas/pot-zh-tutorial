<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 273" role="img" aria-label="这是一个满足部分传输约束的可行计划，不声称在某个成本下最优。m=0.7 表示绝对运输质量；只有总质量都为 1 时，它才同时是 70%。"><title>这是一个满足部分传输约束的可行计划，不声称在某个成本下最优。m=0.7 表示绝对运输质量；只有总质量都为 1 时，它才同时是 70%。</title><text x="320" y="29" font-size="16" fill="#29433a" text-anchor="middle" font-weight="600" font-family="Segoe UI,Microsoft YaHei,sans-serif">上界 a=(0.6,0.4)，b=(0.5,0.5)，预算 m=0.7</text><rect x="84" y="66" width="67" height="67" rx="5" fill="#26786b" opacity="0.83"/><text x="117.5" y="105.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">0.50</text><rect x="155" y="66" width="67" height="67" rx="5" fill="#26786b" opacity="0.23000000000000004"/><text x="188.5" y="105.5" font-size="16" fill="#29433a" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">0.10</text><rect x="84" y="137" width="67" height="67" rx="5" fill="#26786b" opacity="0.08"/><text x="117.5" y="176.5" font-size="16" fill="#29433a" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">0</text><rect x="155" y="137" width="67" height="67" rx="5" fill="#26786b" opacity="0.23000000000000004"/><text x="188.5" y="176.5" font-size="16" fill="#29433a" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">0.10</text><text x="388" y="85" font-size="16" fill="#29433a" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">实际行和 = (0.6,0.1)</text><text x="388" y="122" font-size="16" fill="#29433a" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">实际列和 = (0.5,0.2)</text><text x="388" y="159" font-size="16" fill="#26786b" text-anchor="middle" font-weight="600" font-family="Segoe UI,Microsoft YaHei,sans-serif">计划总量 = 0.7</text><text x="388" y="196" font-size="15" fill="#687d70" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">两侧各有 0.3 未参与匹配</text><text x="320" y="246" font-size="16" fill="#d7834d" text-anchor="middle" font-weight="600" font-family="Segoe UI,Microsoft YaHei,sans-serif">行和 ≤ a，列和 ≤ b，总和 = m</text></svg>