<svg width="640" height="210" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" role="img" aria-label="同一对单点分布：平方成本是 9，W₂ 是 3。函数名里的 “2” 不能替代对成本定义和单位的检查。"><rect x="24" y="58" width="185" height="78" rx="8" fill="#e7eee3"/><text x="116" y="91" font-size="16" fill="#26786b" font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">移动距离 3</text><text x="116" y="116" font-size="11" fill="#718477" font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">δ₀ → δ₃</text><text x="218" y="103" font-size="22" fill="#29433a" font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">→</text><rect x="226" y="58" width="185" height="78" rx="8" fill="#e7eee3"/><text x="318" y="91" font-size="16" fill="#26786b" font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">平方运输成本 9</text><text x="318" y="116" font-size="11" fill="#718477" font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">使用 C = |x − y|²</text><text x="420" y="103" font-size="22" fill="#29433a" font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">→</text><rect x="428" y="58" width="185" height="78" rx="8" fill="#e7eee3"/><text x="520" y="91" font-size="16" fill="#26786b" font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">W₂ 距离 3</text><text x="520" y="116" font-size="11" fill="#718477" font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">对最优成本开平方</text></svg>