<svg width="640" height="260" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-label="右侧向量是教学数值。B 的作用是统一模型参数化的单位；噪声预测与速度预测不能直接混减。"><title>右侧向量是教学数值。B 的作用是统一模型参数化的单位；噪声预测与速度预测不能直接混减。</title><text x="320" y="25" font-size="17" fill="#29433a" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif">同一锚点、共享噪声，查询两提示 × 两时刻</text><rect x="20" y="45" width="270" height="155" rx="8" fill="#e8f0e4"/><rect x="350" y="45" width="270" height="155" rx="8" fill="#e8f0e4"/><text x="155" y="74" font-size="16" fill="#29433a" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif">时刻 t−δ</text><text x="485" y="74" font-size="16" fill="#29433a" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif">时刻 t</text><text x="155" y="108" font-size="14" fill="#29433a" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif">源输出 Qₛ → 目标输出 Qₜ</text><text x="485" y="108" font-size="14" fill="#29433a" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif">源输出 Qₛ → 目标输出 Qₜ</text><text x="155" y="143" font-size="13" fill="#29433a" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif">ΔQ₋ 经 Bₜ₋δ 换到同一单位</text><text x="485" y="143" font-size="13" fill="#29433a" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif">ΔQ₊ 经 Bₜ 换到同一单位</text><text x="155" y="179" font-size="18" fill="#26786b" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif">R₋ = (1, 0)</text><text x="485" y="179" font-size="18" fill="#d7834d" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif">R₊ = (1, 4)</text><text x="320" y="235" font-size="14" fill="#29433a" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif">四组条件可合并成一个批次，仍是四组输入</text></svg>