<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 245" role="img" aria-label="输入为 δ₀、δ₁，各占一半重心权重；本图没有熵正则。目标是 ½W₂²(ρ,δ₀)+½W₂²(ρ,δ₁)。固定支撑 {0,1} 上目标恒为 0.5，权重未必唯一；自由支撑 δ₀.₅ 达到 0.25。"><title>输入为 δ₀、δ₁，各占一半重心权重；本图没有熵正则。目标是 ½W₂²(ρ,δ₀)+½W₂²(ρ,δ₁)。固定支撑 {0,1} 上目标恒为 0.5，权重未必唯一；自由支撑 δ₀.₅ 达到 0.25。</title><text x="155" y="30" font-size="16" fill="#29433a" text-anchor="middle" font-weight="600" font-family="Segoe UI,Microsoft YaHei,sans-serif">固定支撑只能选 {0,1}</text><text x="485" y="30" font-size="16" fill="#29433a" text-anchor="middle" font-weight="600" font-family="Segoe UI,Microsoft YaHei,sans-serif">自由支撑可以移到 0.5</text><line x1="50" y1="155" x2="260" y2="155" stroke="#b7c9ba" stroke-width="2" /><line x1="50" y1="151" x2="50" y2="159" stroke="#b7c9ba" stroke-width="2" /><text x="50" y="180" font-size="14" fill="#687d70" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">0</text><line x1="155" y1="151" x2="155" y2="159" stroke="#b7c9ba" stroke-width="2" /><text x="155" y="180" font-size="14" fill="#687d70" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">0.5</text><line x1="260" y1="151" x2="260" y2="159" stroke="#b7c9ba" stroke-width="2" /><text x="260" y="180" font-size="14" fill="#687d70" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">1</text><line x1="380" y1="155" x2="590" y2="155" stroke="#b7c9ba" stroke-width="2" /><line x1="380" y1="151" x2="380" y2="159" stroke="#b7c9ba" stroke-width="2" /><text x="380" y="180" font-size="14" fill="#687d70" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">0</text><line x1="485" y1="151" x2="485" y2="159" stroke="#b7c9ba" stroke-width="2" /><text x="485" y="180" font-size="14" fill="#687d70" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">0.5</text><line x1="590" y1="151" x2="590" y2="159" stroke="#b7c9ba" stroke-width="2" /><text x="590" y="180" font-size="14" fill="#687d70" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">1</text><circle cx="50" cy="155" r="13" fill="#26786b" /><circle cx="260" cy="155" r="13" fill="#26786b" /><circle cx="155" cy="155" r="13" fill="none" stroke="#687d70" stroke-width="2" stroke-dasharray="4 3"/><text x="155" y="102" font-size="14" fill="#687d70" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">中间位置不在候选网格</text><circle cx="485" cy="155" r="21" fill="#d7834d" /><text x="485" y="113" font-size="14" fill="#d7834d" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">全部质量放在这里</text><text x="155" y="218" font-size="16" fill="#26786b" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">最小目标 = 0.5</text><text x="485" y="218" font-size="16" fill="#d7834d" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">最小目标 = 0.25</text></svg>