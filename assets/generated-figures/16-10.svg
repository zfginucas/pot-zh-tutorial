<svg width="640" height="388" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 388" role="img" aria-label="COMMOT 共享容量原理的两配体教学子问题。三份未匹配量为 1−p₁、1−p₂、1−p₁−p₂，目标为 1.5−0.8p₁−0.2p₂。距离阈值还可直接禁止某条边。"><title>COMMOT 共享容量原理的两配体教学子问题。三份未匹配量为 1−p₁、1−p₂、1−p₁−p₂，目标为 1.5−0.8p₁−0.2p₂。距离阈值还可直接禁止某条边。</title><text x="320" y="26" text-anchor="middle" font-size="17" fill="#29433a" font-family="Segoe UI,Microsoft YaHei,sans-serif">两个配体供给，共享一个受体容量</text><circle cx="99" cy="102" r="24" fill="#26786b"/><text x="99" y="107" text-anchor="middle" font-size="14" fill="#ffffff" font-family="Segoe UI,Microsoft YaHei,sans-serif">L₁</text><text x="99" y="148" text-anchor="middle" font-size="15" fill="#29433a" font-family="Segoe UI,Microsoft YaHei,sans-serif">可用量 1</text><circle cx="99" cy="240" r="24" fill="#26786b"/><text x="99" y="245" text-anchor="middle" font-size="14" fill="#ffffff" font-family="Segoe UI,Microsoft YaHei,sans-serif">L₂</text><text x="99" y="286" text-anchor="middle" font-size="15" fill="#29433a" font-family="Segoe UI,Microsoft YaHei,sans-serif">可用量 1</text><circle cx="510" cy="172" r="33" fill="#d7834d"/><text x="510" y="177" text-anchor="middle" font-size="14" fill="#ffffff" font-family="Segoe UI,Microsoft YaHei,sans-serif">R</text><text x="510" y="227" text-anchor="middle" font-size="16" fill="#29433a" font-family="Segoe UI,Microsoft YaHei,sans-serif">共享容量 1</text><line x1="139" y1="108" x2="463" y2="160" stroke="#26786b" stroke-width="5"/><polygon points="463,160 454.37803003027585,162.58101411099878 455.61871971341554,154.8505630083591" fill="#26786b"/><line x1="139" y1="234" x2="463" y2="184" stroke="#667b6e" stroke-width="2"/><polygon points="463,184 455.58783578705675,189.10488214167216 454.3937332867268,181.36709793953406" fill="#667b6e"/><text x="309" y="93" text-anchor="middle" font-size="15" fill="#29433a" font-family="Segoe UI,Microsoft YaHei,sans-serif">p₁，单位距离成本 c₁ = 0.2</text><text x="309" y="267" text-anchor="middle" font-size="15" fill="#29433a" font-family="Segoe UI,Microsoft YaHei,sans-serif">p₂，单位距离成本 c₂ = 0.8</text><text x="320" y="300" text-anchor="middle" font-size="20" fill="#29433a" font-family="Segoe UI,Microsoft YaHei,sans-serif">p₁ + p₂ ≤ 1</text><text x="320" y="326" text-anchor="middle" font-size="15" fill="#29433a" font-family="Segoe UI,Microsoft YaHei,sans-serif">同一个容量被共同使用</text><text x="320" y="366" text-anchor="middle" font-size="15" fill="#29433a" font-family="Segoe UI,Microsoft YaHei,sans-serif">取未匹配罚系数 ρ = 0.5、ε = 0，得到 p₁ = 1、p₂ = 0</text></svg>