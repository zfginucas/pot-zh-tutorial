<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 165" role="img" aria-label="一个细胞可关联多个候选位置；强行 argmax 会隐藏不确定性。"><title>一个细胞可关联多个候选位置；强行 argmax 会隐藏不确定性。</title><rect x="25" y="25" width="176.66666666666666" height="115" rx="7" fill="#e7eee3" /><text x="113.33333333333333" y="56" font-size="17" fill="#26786b" text-anchor="middle" font-weight="600" font-family="Segoe UI,Microsoft YaHei,sans-serif">scRNA 细胞</text><text x="113.33333333333333" y="93" font-size="14" fill="#687d70" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">高维表达，缺少坐标</text><line x1="206.66666666666666" y1="82.5" x2="226.66666666666666" y2="82.5" stroke="#26786b" stroke-width="2" /><polygon points="226.66666666666666,82.5 218.56264274549255,86.41468980700107 218.56264274549255,78.58531019299893" fill="#26786b"/><rect x="231.66666666666666" y="25" width="176.66666666666666" height="115" rx="7" fill="#e7eee3" /><text x="320" y="56" font-size="17" fill="#26786b" text-anchor="middle" font-weight="600" font-family="Segoe UI,Microsoft YaHei,sans-serif">关联到空间参考</text><text x="320" y="93" font-size="14" fill="#687d70" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">共同基因 + 结构</text><line x1="413.3333333333333" y1="82.5" x2="433.3333333333333" y2="82.5" stroke="#26786b" stroke-width="2" /><polygon points="433.3333333333333,82.5 425.22930941215924,86.41468980700107 425.22930941215924,78.58531019299893" fill="#26786b"/><rect x="438.3333333333333" y="25" width="176.66666666666666" height="115" rx="7" fill="#e7eee3" /><text x="526.6666666666666" y="56" font-size="17" fill="#26786b" text-anchor="middle" font-weight="600" font-family="Segoe UI,Microsoft YaHei,sans-serif">位置权重 / 表</text><text x="526.6666666666666" y="80" font-size="17" fill="#26786b" text-anchor="middle" font-weight="600" font-family="Segoe UI,Microsoft YaHei,sans-serif">达预测</text><text x="526.6666666666666" y="117" font-size="14" fill="#687d70" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">保留不确定性</text></svg>