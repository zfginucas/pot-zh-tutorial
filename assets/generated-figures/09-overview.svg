<svg width="640" height="210" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" role="img" aria-label="三种模型有不同约束。部分 OT 的 m 是绝对质量；非平衡 OT 的边缘可大于或小于输入，不是单纯丢弃质量。"><rect x="24" y="58" width="185" height="78" rx="8" fill="#e7eee3"/><text x="116" y="91" font-size="16" fill="#26786b" font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">平衡 OT</text><text x="116" y="116" font-size="11" fill="#718477" font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">硬约束：边缘相等</text><text x="218" y="103" font-size="22" fill="#29433a" font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">→</text><rect x="226" y="58" width="185" height="78" rx="8" fill="#e7eee3"/><text x="318" y="91" font-size="16" fill="#26786b" font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">非平衡 OT</text><text x="318" y="116" font-size="11" fill="#718477" font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">偏离边缘需要付费</text><text x="420" y="103" font-size="22" fill="#29433a" font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">→</text><rect x="428" y="58" width="185" height="78" rx="8" fill="#e7eee3"/><text x="520" y="91" font-size="16" fill="#26786b" font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">部分 OT</text><text x="520" y="116" font-size="11" fill="#718477" font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">规定绝对运输预算 m</text></svg>