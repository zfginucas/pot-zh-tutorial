<svg width="640" height="246" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 246" role="img" aria-label="GW 比较源空间的 Cᵢₖ 与目标空间的 Dⱼₗ，并乘以匹配质量 TᵢⱼTₖₗ。图中边的长度为排版示意，旁边的 2、3 才是输入的内部相异度；跨空间虚线不是地面成本。"><title>GW 比较源空间的 Cᵢₖ 与目标空间的 Dⱼₗ，并乘以匹配质量 TᵢⱼTₖₗ。图中边的长度为排版示意，旁边的 2、3 才是输入的内部相异度；跨空间虚线不是地面成本。</title><text x="320" y="27" font-size="16" fill="#29433a" text-anchor="middle" font-weight="600" font-family="Segoe UI,Microsoft YaHei,sans-serif">一次结构比较，涉及两对匹配</text><line x1="112" y1="83" x2="112" y2="193" stroke="#26786b" stroke-width="4" /><line x1="528" y1="83" x2="528" y2="193" stroke="#d7834d" stroke-width="4" /><circle cx="112" cy="83" r="17" fill="#26786b" /><circle cx="112" cy="193" r="17" fill="#26786b" /><circle cx="528" cy="83" r="17" fill="#d7834d" /><circle cx="528" cy="193" r="17" fill="#d7834d" /><text x="112" y="88" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">i</text><text x="112" y="198" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">k</text><text x="528" y="88" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">j</text><text x="528" y="198" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">l</text><line x1="143" y1="83" x2="496" y2="83" stroke="#687d70" stroke-width="2" stroke-dasharray="7 5"/><line x1="143" y1="193" x2="496" y2="193" stroke="#687d70" stroke-width="2" stroke-dasharray="7 5"/><text x="52" y="144" font-size="22" fill="#26786b" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">2</text><text x="589" y="144" font-size="22" fill="#d7834d" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">3</text><text x="320" y="132" font-size="16" fill="#29433a" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">内部距离失配</text><text x="320" y="165" font-size="23" fill="#26786b" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">(2 − 3)² = 1</text></svg>