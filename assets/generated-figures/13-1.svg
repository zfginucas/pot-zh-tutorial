<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 249" role="img" aria-label="固定边缘与 ε 时，完整正则最优值的梯度等于 P*。计划对成本的导数则描述“每个成本扰动如何改变每个计划元素”，是高一阶的对象。"><title>固定边缘与 ε 时，完整正则最优值的梯度等于 P*。计划对成本的导数则描述“每个成本扰动如何改变每个计划元素”，是高一阶的对象。</title><text x="320" y="28" font-size="16" fill="#29433a" text-anchor="middle" font-weight="600" font-family="Segoe UI,Microsoft YaHei,sans-serif">一次求解可以产生不同形状的数学对象</text><rect x="22" y="58" width="163" height="113" rx="7" fill="#e7eee3" /><text x="103" y="89" font-size="15" fill="#26786b" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">输入成本 M</text><text x="103" y="119" font-size="15" fill="#29433a" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">n × m 矩阵</text><text x="103" y="149" font-size="14" fill="#687d70" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">改变一个成本元素</text><line x1="193" y1="114" x2="226" y2="114" stroke="#26786b" stroke-width="2" /><polygon points="226,114 217.8959760788259,117.91468980700107 217.8959760788259,110.08531019299893" fill="#26786b"/><rect x="238" y="58" width="163" height="113" rx="7" fill="#e7eee3" /><text x="319" y="89" font-size="15" fill="#26786b" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">最优计划 P*(M)</text><text x="319" y="119" font-size="15" fill="#29433a" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">n × m 矩阵</text><text x="319" y="149" font-size="14" fill="#687d70" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">计划本身会跟着变</text><line x1="409" y1="114" x2="442" y2="114" stroke="#26786b" stroke-width="2" /><polygon points="442,114 433.8959760788259,117.91468980700107 433.8959760788259,110.08531019299893" fill="#26786b"/><rect x="454" y="58" width="163" height="113" rx="7" fill="#e7eee3" /><text x="535" y="89" font-size="15" fill="#26786b" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">完整最优值 F(M)</text><text x="535" y="119" font-size="15" fill="#29433a" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">一个标量</text><text x="535" y="149" font-size="14" fill="#687d70" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">包含运输成本与熵项</text><text x="172" y="219" font-size="16" fill="#26786b" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">∂F/∂M：n × m</text><text x="474" y="219" font-size="16" fill="#d7834d" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">∂P/∂M：n × m × n × m</text></svg>