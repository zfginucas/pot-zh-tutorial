<svg width="640" height="250" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-label="可手算例子：a=b=(0.5,0.5)，C=[[1,3],[3,1]]。取 u=v=(0.3,0.3)，对偶值为 0.6；取 P=[[0.4,0.1],[0.1,0.4]]，原始值为 1.4；最优对角计划成本为 1。"><title>可手算例子：a=b=(0.5,0.5)，C=[[1,3],[3,1]]。取 u=v=(0.3,0.3)，对偶值为 0.6；取 P=[[0.4,0.1],[0.1,0.4]]，原始值为 1.4；最优对角计划成本为 1。</title><text x="320" y="28" font-size="16" fill="#29433a" text-anchor="middle" font-weight="600" font-family="Segoe UI,Microsoft YaHei,sans-serif">对偶给下界，原始可行方案给上界</text><line x1="75" y1="120" x2="565" y2="120" stroke="#b7c9ba" stroke-width="5" /><circle cx="105" cy="120" r="10" fill="#d7834d" /><text x="105" y="88" font-size="22" fill="#d7834d" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">0.6</text><text x="105" y="159" font-size="15" fill="#29433a" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">对偶可行值</text><circle cx="320" cy="120" r="10" fill="#26786b" /><text x="320" y="88" font-size="22" fill="#26786b" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">1.0</text><text x="320" y="159" font-size="15" fill="#29433a" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">真正最优值</text><circle cx="535" cy="120" r="10" fill="#d7834d" /><text x="535" y="88" font-size="22" fill="#d7834d" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">1.4</text><text x="535" y="159" font-size="15" fill="#29433a" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">原始可行值</text><line x1="160" y1="195" x2="280" y2="195" stroke="#d7834d" stroke-width="2" /><polygon points="280,195 271.8959760788259,198.91468980700108 271.8959760788259,191.08531019299892" fill="#d7834d"/><line x1="480" y1="195" x2="360" y2="195" stroke="#d7834d" stroke-width="2" /><polygon points="360,195 368.1040239211741,191.08531019299892 368.1040239211741,198.91468980700108" fill="#d7834d"/><text x="320" y="225" font-size="16" fill="#687d70" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">两个证书在最优值处相遇</text></svg>