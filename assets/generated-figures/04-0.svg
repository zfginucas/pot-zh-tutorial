<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 255" role="img" aria-label="这里的一维排序匹配是最优的。W₁=(1+3)/2=2，而 W₂=√5≈2.236；“平均移动距离”与“均方距离开根”反映不同的惩罚偏好。"><title>这里的一维排序匹配是最优的。W₁=(1+3)/2=2，而 W₂=√5≈2.236；“平均移动距离”与“均方距离开根”反映不同的惩罚偏好。</title><text x="320" y="29" font-size="16" fill="#29433a" text-anchor="middle" font-weight="600" font-family="Segoe UI,Microsoft YaHei,sans-serif">两组等权样本：0 ↔ 1，2 ↔ 5</text><rect x="32" y="51" width="575" height="51" rx="7" fill="#e7eee3" /><text x="53" y="83" font-size="15" fill="#29433a" text-anchor="start" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">每对的移动距离</text><text x="370" y="83" font-size="18" fill="#26786b" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">1</text><text x="540" y="83" font-size="18" fill="#d7834d" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">3</text><rect x="32" y="113" width="575" height="51" rx="7" fill="#e7eee3" /><text x="53" y="145" font-size="15" fill="#29433a" text-anchor="start" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">平方后按质量平均</text><text x="370" y="145" font-size="18" fill="#26786b" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">(1² + 3²) / 2</text><text x="540" y="145" font-size="18" fill="#d7834d" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">= 5</text><rect x="32" y="175" width="575" height="51" rx="7" fill="#dceadc" /><text x="53" y="207" font-size="15" fill="#29433a" text-anchor="start" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">最后才开平方</text><text x="370" y="207" font-size="18" fill="#26786b" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">W₂ = √5</text><text x="540" y="207" font-size="18" fill="#d7834d" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">≈ 2.236</text></svg>