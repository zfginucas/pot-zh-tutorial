<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 249" role="img" aria-label="平衡 OT 中，将整个成本矩阵和 ε 同乘正数 λ，目标只整体乘以 λ，最优计划不变。只缩放成本、保持 ε 不变，会改变相对正则强度。"><title>平衡 OT 中，将整个成本矩阵和 ε 同乘正数 λ，目标只整体乘以 λ，最优计划不变。只缩放成本、保持 ε 不变，会改变相对正则强度。</title><text x="320" y="31" font-size="16" fill="#29433a" text-anchor="middle" font-weight="600" font-family="Segoe UI,Microsoft YaHei,sans-serif">关键比值是 C / ε</text><rect x="30" y="60" width="258" height="123" rx="7" fill="#e7eee3" /><text x="159" y="92" font-size="16" fill="#29433a" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">典型成本 1</text><text x="159" y="125" font-size="16" fill="#d7834d" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">ε = 0.1</text><text x="159" y="159" font-size="16" fill="#26786b" text-anchor="middle" font-weight="600" font-family="Segoe UI,Microsoft YaHei,sans-serif">C/ε = 10</text><rect x="352" y="60" width="258" height="123" rx="7" fill="#e7eee3" /><text x="481" y="92" font-size="16" fill="#29433a" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">典型成本 100</text><text x="481" y="125" font-size="16" fill="#d7834d" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">ε = 10</text><text x="481" y="159" font-size="16" fill="#26786b" text-anchor="middle" font-weight="600" font-family="Segoe UI,Microsoft YaHei,sans-serif">C/ε = 10</text><text x="320" y="126" font-size="25" fill="#29433a" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">＝</text><text x="320" y="223" font-size="15" fill="#26786b" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">同步缩放成本与 ε → 同一个核 K → 同一个最优计划</text></svg>