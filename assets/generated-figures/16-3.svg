<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 165" role="img" aria-label="允许不配对的意义是避免强造对应，而不是把未匹配区域从生物学解释中删掉。"><title>允许不配对的意义是避免强造对应，而不是把未匹配区域从生物学解释中删掉。</title><rect x="25" y="25" width="176.66666666666666" height="115" rx="7" fill="#e7eee3" /><text x="113.33333333333333" y="56" font-size="17" fill="#26786b" text-anchor="middle" font-weight="600" font-family="Segoe UI,Microsoft YaHei,sans-serif">共同区 + 独有</text><text x="113.33333333333333" y="80" font-size="17" fill="#26786b" text-anchor="middle" font-weight="600" font-family="Segoe UI,Microsoft YaHei,sans-serif">区</text><text x="113.33333333333333" y="117" font-size="14" fill="#687d70" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">切片视野并非完全相同</text><line x1="206.66666666666666" y1="82.5" x2="226.66666666666666" y2="82.5" stroke="#26786b" stroke-width="2" /><polygon points="226.66666666666666,82.5 218.56264274549255,86.41468980700107 218.56264274549255,78.58531019299893" fill="#26786b"/><rect x="231.66666666666666" y="25" width="176.66666666666666" height="115" rx="7" fill="#e7eee3" /><text x="320" y="56" font-size="17" fill="#26786b" text-anchor="middle" font-weight="600" font-family="Segoe UI,Microsoft YaHei,sans-serif">部分 FGW</text><text x="320" y="93" font-size="14" fill="#687d70" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">只匹配预算内的质量</text><line x1="413.3333333333333" y1="82.5" x2="433.3333333333333" y2="82.5" stroke="#26786b" stroke-width="2" /><polygon points="433.3333333333333,82.5 425.22930941215924,86.41468980700107 425.22930941215924,78.58531019299893" fill="#26786b"/><rect x="438.3333333333333" y="25" width="176.66666666666666" height="115" rx="7" fill="#e7eee3" /><text x="526.6666666666666" y="56" font-size="17" fill="#26786b" text-anchor="middle" font-weight="600" font-family="Segoe UI,Microsoft YaHei,sans-serif">关联 + 未匹配</text><text x="526.6666666666666" y="80" font-size="17" fill="#26786b" text-anchor="middle" font-weight="600" font-family="Segoe UI,Microsoft YaHei,sans-serif">部分</text><text x="526.6666666666666" y="117" font-size="14" fill="#687d70" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">同时报告质量与覆盖率</text></svg>