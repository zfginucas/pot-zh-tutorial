<svg width="640" height="332" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 332" role="img" aria-label="这里只比较上一图两份给定候选计划。α=0.6 是这两条目标曲线的交点，完整 FGW 还会搜索其他可行计划。"><title>这里只比较上一图两份给定候选计划。α=0.6 是这两条目标曲线的交点，完整 FGW 还会搜索其他可行计划。</title><text x="320" y="25" text-anchor="middle" font-size="17" fill="#29433a" font-family="Segoe UI,Microsoft YaHei,sans-serif">同一输入，只改变 α</text><line x1="65" y1="248" x2="578" y2="248" stroke="#aabfac" stroke-width="2"/><line x1="65" y1="248" x2="65" y2="55" stroke="#aabfac" stroke-width="2"/><text x="65" y="272" text-anchor="middle" font-size="14" fill="#29433a" font-family="Segoe UI,Microsoft YaHei,sans-serif">0</text><text x="215" y="272" text-anchor="middle" font-size="14" fill="#29433a" font-family="Segoe UI,Microsoft YaHei,sans-serif">0.3</text><text x="365" y="272" text-anchor="middle" font-size="14" fill="#29433a" font-family="Segoe UI,Microsoft YaHei,sans-serif">0.6</text><text x="565" y="272" text-anchor="middle" font-size="14" fill="#29433a" font-family="Segoe UI,Microsoft YaHei,sans-serif">1</text><text x="43" y="253" text-anchor="middle" font-size="13" fill="#29433a" font-family="Segoe UI,Microsoft YaHei,sans-serif">0.0</text><text x="43" y="202" text-anchor="middle" font-size="13" fill="#29433a" font-family="Segoe UI,Microsoft YaHei,sans-serif">0.2</text><text x="43" y="151" text-anchor="middle" font-size="13" fill="#29433a" font-family="Segoe UI,Microsoft YaHei,sans-serif">0.4</text><text x="43" y="100" text-anchor="middle" font-size="13" fill="#29433a" font-family="Segoe UI,Microsoft YaHei,sans-serif">0.6</text><line x1="65" y1="78" x2="565" y2="248" stroke="#26786b" stroke-width="4"/><line x1="65" y1="248" x2="565" y2="134.66666666666669" stroke="#d7834d" stroke-width="4"/><line x1="365" y1="248" x2="365" y2="180" stroke="#667b6e" stroke-width="1" stroke-dasharray="5 5"/><circle cx="365" cy="180" r="5" fill="#29433a"/><text x="180" y="48" text-anchor="middle" font-size="14" fill="#26786b" font-family="Segoe UI,Microsoft YaHei,sans-serif">结构保持计划 F = (1−α)×⅔</text><text x="412" y="228" text-anchor="middle" font-size="14" fill="#d7834d" font-family="Segoe UI,Microsoft YaHei,sans-serif">表达匹配计划 F = α×4/9</text><text x="410" y="143" text-anchor="middle" font-size="14" fill="#29433a" font-family="Segoe UI,Microsoft YaHei,sans-serif">α = 0.6，两者均为 4/15</text><text x="320" y="310" text-anchor="middle" font-size="15" fill="#29433a" font-family="Segoe UI,Microsoft YaHei,sans-serif">α = 0.2 时更偏好表达匹配，α = 0.8 时更偏好结构保持</text></svg>