<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" role="img" aria-label="横向位置表示支撑 xᵢ，柱高表示质量 aᵢ。移动柱子会改变几何，改变柱高会改变权重。"><path d="M55 158L590 158" stroke="#becdbd" stroke-width="2" fill="none"/><path d="M140 158L140 111" stroke="#26786b" stroke-width="16" fill="none"/><path d="M315 158L315 64" stroke="#26786b" stroke-width="16" fill="none"/><path d="M495 158L495 111" stroke="#26786b" stroke-width="16" fill="none"/><text x="140" y="187" font-size="14" fill="#29433a" font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">x₁ = 0</text><text x="315" y="187" font-size="14" fill="#29433a" font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">x₂ = 1</text><text x="495" y="187" font-size="14" fill="#29433a" font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">x₃ = 2</text><text x="140" y="97" font-size="14" fill="#29433a" font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">¼</text><text x="315" y="49" font-size="14" fill="#29433a" font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">½</text><text x="495" y="97" font-size="14" fill="#29433a" font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">¼</text><text x="490" y="25" font-size="12" fill="#718477" font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">高度 = 质量 aᵢ</text></svg>