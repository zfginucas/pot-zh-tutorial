<svg width="640" height="260" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-label="沿用权重 0.75、0.25，û=(1,3)。不能从凸性推出“每次都比当前估计好”。"><title>沿用权重 0.75、0.25，û=(1,3)。不能从凸性推出“每次都比当前估计好”。</title><text x="320" y="25" font-size="18" fill="#29433a" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif">反例：R₋=(1,4)，R₊=(1,0)</text><rect x="25" y="55" width="180" height="120" rx="8" fill="#e8f0e4"/><rect x="230" y="55" width="180" height="120" rx="8" fill="#e8f0e4"/><rect x="435" y="55" width="180" height="120" rx="8" fill="#e8f0e4"/><text x="115" y="90" font-size="15" fill="#29433a" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif">当前能量</text><text x="115" y="135" font-size="26" fill="#d7834d" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif">1</text><text x="320" y="90" font-size="15" fill="#29433a" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif">平滑能量</text><text x="320" y="135" font-size="26" fill="#26786b" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif">10</text><text x="525" y="90" font-size="15" fill="#29433a" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif">加权能量上界</text><text x="525" y="135" font-size="26" fill="#29433a" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif">13</text><text x="320" y="225" font-size="17" fill="#29433a" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif">1 &lt; 10 ≤ 13：当前更稳定时，平滑可以变差</text></svg>