<svg width="640" height="254" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 254" role="img" aria-label="源点为 (0,0)、(1,0)，目标点为 (0,1)、(1,1)，各点等权。横轴投影的一维 W₂=0，纵轴投影为 1，原空间 W₂=1。二维所有单位方向均匀平均后 SW₂=1/√2，而不是 1。"><title>源点为 (0,0)、(1,0)，目标点为 (0,1)、(1,1)，各点等权。横轴投影的一维 W₂=0，纵轴投影为 1，原空间 W₂=1。二维所有单位方向均匀平均后 SW₂=1/√2，而不是 1。</title><text x="320" y="28" font-size="16" fill="#29433a" text-anchor="middle" font-weight="600" font-family="Segoe UI,Microsoft YaHei,sans-serif">同一组二维点，换个方向看到的差异不同</text><text x="146" y="62" font-size="15" fill="#29433a" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">原空间：目标整体向上 1</text><line x1="73" y1="174" x2="235" y2="174" stroke="#b7c9ba" stroke-width="2" /><line x1="73" y1="174" x2="73" y2="82" stroke="#b7c9ba" stroke-width="2" /><circle cx="100" cy="160" r="9" fill="#26786b" /><circle cx="200" cy="160" r="9" fill="#26786b" /><circle cx="100" cy="93" r="9" fill="#d7834d" /><circle cx="200" cy="93" r="9" fill="#d7834d" /><line x1="245" y1="130" x2="302" y2="130" stroke="#26786b" stroke-width="2" /><polygon points="302,130 293.8959760788259,133.91468980700108 293.8959760788259,126.08531019299893" fill="#26786b"/><text x="462" y="69" font-size="15" fill="#29433a" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">投影到横轴：完全重合</text><line x1="370" y1="109" x2="560" y2="109" stroke="#b7c9ba" stroke-width="2" /><circle cx="407" cy="109" r="11" fill="#d7834d" /><circle cx="407" cy="109" r="6" fill="#26786b" /><circle cx="520" cy="109" r="11" fill="#d7834d" /><circle cx="520" cy="109" r="6" fill="#26786b" /><text x="462" y="158" font-size="15" fill="#29433a" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">投影到纵轴：相距 1</text><line x1="370" y1="196" x2="560" y2="196" stroke="#b7c9ba" stroke-width="2" /><circle cx="407" cy="196" r="9" fill="#26786b" /><circle cx="520" cy="196" r="9" fill="#d7834d" /><text x="462" y="226" font-size="15" fill="#687d70" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">单个方向可能看不见位移</text></svg>