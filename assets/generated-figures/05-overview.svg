<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" role="img" aria-label="在有限可行的离散线性 OT 中，强对偶把运输最小值与对偶最大值连接起来。数值上先检查可行性，再检查 gap。"><rect x="24" y="58" width="185" height="78" rx="8" fill="#e7eee3"/><text x="116" y="91" font-size="16" fill="#26786b" font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">原始：安排运输</text><text x="116" y="116" font-size="11" fill="#718477" font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">可行计划给目标上界</text><text x="218" y="103" font-size="22" fill="#29433a" font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">→</text><rect x="226" y="58" width="185" height="78" rx="8" fill="#e7eee3"/><text x="318" y="91" font-size="16" fill="#26786b" font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">最优时，两者相等</text><text x="318" y="116" font-size="11" fill="#718477" font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">primal − dual = 0</text><text x="420" y="103" font-size="22" fill="#29433a" font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">→</text><rect x="428" y="58" width="185" height="78" rx="8" fill="#e7eee3"/><text x="520" y="91" font-size="16" fill="#26786b" font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">对偶：设置势函数</text><text x="520" y="116" font-size="11" fill="#718477" font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">uᵢ + vⱼ ≤ Cᵢⱼ</text></svg>