<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 247" role="img" aria-label="一行计划把单位质量分别送到 0 与 2，重心映射却只输出平均位置 1。它保留加权均值，但压缩了分散程度；映射后的确定性分布一般不等于目标分布。"><title>一行计划把单位质量分别送到 0 与 2，重心映射却只输出平均位置 1。它保留加权均值，但压缩了分散程度；映射后的确定性分布一般不等于目标分布。</title><text x="155" y="31" font-size="16" fill="#29433a" text-anchor="middle" font-weight="600" font-family="Segoe UI,Microsoft YaHei,sans-serif">目标：两处各一半质量</text><text x="485" y="31" font-size="16" fill="#29433a" text-anchor="middle" font-weight="600" font-family="Segoe UI,Microsoft YaHei,sans-serif">重心映射：所有质量到均值</text><line x1="55" y1="162" x2="255" y2="162" stroke="#b7c9ba" stroke-width="2" /><line x1="55" y1="158" x2="55" y2="166" stroke="#b7c9ba" stroke-width="2" /><text x="55" y="187" font-size="14" fill="#687d70" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">0</text><line x1="155" y1="158" x2="155" y2="166" stroke="#b7c9ba" stroke-width="2" /><text x="155" y="187" font-size="14" fill="#687d70" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">1</text><line x1="255" y1="158" x2="255" y2="166" stroke="#b7c9ba" stroke-width="2" /><text x="255" y="187" font-size="14" fill="#687d70" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">2</text><line x1="385" y1="162" x2="585" y2="162" stroke="#b7c9ba" stroke-width="2" /><line x1="385" y1="158" x2="385" y2="166" stroke="#b7c9ba" stroke-width="2" /><text x="385" y="187" font-size="14" fill="#687d70" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">0</text><line x1="485" y1="158" x2="485" y2="166" stroke="#b7c9ba" stroke-width="2" /><text x="485" y="187" font-size="14" fill="#687d70" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">1</text><line x1="585" y1="158" x2="585" y2="166" stroke="#b7c9ba" stroke-width="2" /><text x="585" y="187" font-size="14" fill="#687d70" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">2</text><rect x="45" y="112" width="20" height="50" rx="7" fill="#d7834d" /><rect x="245" y="112" width="20" height="50" rx="7" fill="#d7834d" /><rect x="475" y="62" width="20" height="100" rx="7" fill="#26786b" /><text x="55" y="98" font-size="16" fill="#29433a" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">1/2</text><text x="255" y="98" font-size="16" fill="#29433a" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">1/2</text><text x="485" y="48" font-size="16" fill="#29433a" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">1</text><line x1="285" y1="124" x2="345" y2="124" stroke="#26786b" stroke-width="2" /><polygon points="345,124 336.8959760788259,127.91468980700107 336.8959760788259,120.08531019299893" fill="#26786b"/><text x="320" y="95" font-size="14" fill="#29433a" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">取均值</text><text x="155" y="220" font-size="16" fill="#d7834d" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">均值 1，方差 1</text><text x="485" y="220" font-size="16" fill="#26786b" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">均值 1，方差 0</text></svg>