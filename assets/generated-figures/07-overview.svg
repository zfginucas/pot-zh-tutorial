<svg width="640" height="210" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" role="img" aria-label="三次求解使用同一 ε、同一地面成本规则和同一正则约定。减去自比较项消除偏差，不代表自动满足三角不等式。"><rect x="28" y="58" width="180" height="80" rx="8" fill="#e7eee3"/><rect x="237" y="58" width="172" height="80" rx="8" fill="#e7eee3"/><rect x="438" y="58" width="172" height="80" rx="8" fill="#e7eee3"/><text x="118" y="93" font-size="13" fill="#29433a" font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">两分布的正则目标</text><text x="118" y="118" font-size="16" fill="#26786b" font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">Fε(a,b)</text><text x="220" y="104" font-size="22" fill="#29433a" font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">−</text><text x="323" y="93" font-size="13" fill="#29433a" font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">源分布的自比较</text><text x="323" y="118" font-size="16" fill="#26786b" font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">½ Fε(a,a)</text><text x="423" y="104" font-size="22" fill="#29433a" font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">−</text><text x="524" y="93" font-size="13" fill="#29433a" font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">目标分布的自比较</text><text x="524" y="118" font-size="16" fill="#26786b" font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">½ Fε(b,b)</text></svg>