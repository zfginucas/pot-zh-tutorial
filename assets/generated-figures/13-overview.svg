<svg width="640" height="210" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" role="img" aria-label="这个梯度关系针对完整正则最优值。仅报告线性成本 ⟨P*(M),M⟩ 时，计划随 M 变化产生的导数一般不能忽略。"><rect x="24" y="58" width="185" height="78" rx="8" fill="#e7eee3"/><text x="116" y="91" font-size="16" fill="#26786b" font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">完整正则目标 F</text><text x="116" y="116" font-size="11" fill="#718477" font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">边缘与 ε 固定</text><text x="218" y="103" font-size="22" fill="#29433a" font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">→</text><rect x="226" y="58" width="185" height="78" rx="8" fill="#e7eee3"/><text x="318" y="91" font-size="16" fill="#26786b" font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">微扰一个成本 Mᵢⱼ</text><text x="318" y="116" font-size="11" fill="#718477" font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">重新求解：M ± hEᵢⱼ</text><text x="420" y="103" font-size="22" fill="#29433a" font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">→</text><rect x="428" y="58" width="185" height="78" rx="8" fill="#e7eee3"/><text x="520" y="91" font-size="16" fill="#26786b" font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">中心差分核验</text><text x="520" y="116" font-size="11" fill="#718477" font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">∂F / ∂Mᵢⱼ = P*ᵢⱼ</text></svg>