<svg width="640" height="251" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 251" role="img" aria-label="合成数据贯穿本章。三行表达与三个坐标按 spot 索引相连，每个 spot 的权重为三分之一。"><title>合成数据贯穿本章。三行表达与三个坐标按 spot 索引相连，每个 spot 的权重为三分之一。</title><text x="132" y="27" text-anchor="middle" font-size="17" fill="#29433a" font-family="Segoe UI,Microsoft YaHei,sans-serif">三个 spot 的组织位置</text><text x="416" y="27" text-anchor="middle" font-size="17" fill="#29433a" font-family="Segoe UI,Microsoft YaHei,sans-serif">同一索引的表达与坐标</text><line x1="42" y1="156" x2="248" y2="156" stroke="#aabfac" stroke-width="2"/><circle cx="60" cy="128" r="14" fill="#26786b"/><text x="60" y="133" text-anchor="middle" font-size="14" fill="#ffffff" font-family="Segoe UI,Microsoft YaHei,sans-serif">1</text><text x="60" y="181" text-anchor="middle" font-size="14" fill="#29433a" font-family="Segoe UI,Microsoft YaHei,sans-serif">x = 0</text><circle cx="120" cy="128" r="14" fill="#26786b"/><text x="120" y="133" text-anchor="middle" font-size="14" fill="#ffffff" font-family="Segoe UI,Microsoft YaHei,sans-serif">2</text><text x="120" y="181" text-anchor="middle" font-size="14" fill="#29433a" font-family="Segoe UI,Microsoft YaHei,sans-serif">x = 1</text><circle cx="240" cy="128" r="14" fill="#26786b"/><text x="240" y="133" text-anchor="middle" font-size="14" fill="#ffffff" font-family="Segoe UI,Microsoft YaHei,sans-serif">3</text><text x="240" y="181" text-anchor="middle" font-size="14" fill="#29433a" font-family="Segoe UI,Microsoft YaHei,sans-serif">x = 3</text><text x="305" y="65" text-anchor="middle" font-size="14" fill="#29433a" font-family="Segoe UI,Microsoft YaHei,sans-serif">spot</text><text x="388" y="65" text-anchor="middle" font-size="14" fill="#29433a" font-family="Segoe UI,Microsoft YaHei,sans-serif">基因 g₁</text><text x="470" y="65" text-anchor="middle" font-size="14" fill="#29433a" font-family="Segoe UI,Microsoft YaHei,sans-serif">基因 g₂</text><text x="552" y="65" text-anchor="middle" font-size="14" fill="#29433a" font-fa