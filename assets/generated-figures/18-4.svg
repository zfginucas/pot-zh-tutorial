<svg width="640" height="260" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-label="Jensen 界比较平滑向量能量与加权输入能量，不是仅与当前 R₊ 的能量比较。"><title>Jensen 界比较平滑向量能量与加权输入能量，不是仅与当前 R₊ 的能量比较。</title><rect x="20" y="40" width="180" height="120" rx="8" fill="#e8f0e4"/><rect x="230" y="40" width="180" height="120" rx="8" fill="#e8f0e4"/><rect x="440" y="40" width="180" height="120" rx="8" fill="#e8f0e4"/><text x="110" y="73" font-size="20" fill="#26786b" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif">R₋=(1,0)</text><text x="110" y="111" font-size="15" fill="#29433a" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif">权重 0.75</text><text x="320" y="73" font-size="20" fill="#d7834d" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif">R₊=(1,4)</text><text x="320" y="111" font-size="15" fill="#29433a" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif">权重 0.25</text><text x="530" y="73" font-size="20" fill="#26786b" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif">û=(1,1)</text><text x="530" y="111" font-size="15" fill="#29433a" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif">先平均向量</text><text x="215" y="105" font-size="16" fill="#29433a" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif">+</text><text x="425" y="105" font-size="16" fill="#29433a" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif">=</text><text x="320" y="206" font-size="17" fill="#29433a" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif">‖û‖² = 2    ≤    0.75×1 + 0.25×17 = 5</text></svg>