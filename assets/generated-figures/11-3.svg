<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 258" role="img" aria-label="这里使用十进制 MB（10⁶ 字节）。n=m=10000 时一张矩阵为 800 MB；若同时存储计划，还要再加同量级存储，优化器与自动微分图可能继续增加开销。"><title>这里使用十进制 MB（10⁶ 字节）。n=m=10000 时一张矩阵为 800 MB；若同时存储计划，还要再加同量级存储，优化器与自动微分图可能继续增加开销。</title><text x="320" y="29" font-size="16" fill="#29433a" text-anchor="middle" font-weight="600" font-family="Segoe UI,Microsoft YaHei,sans-serif">仅一张 float64 成本矩阵：8 × n × m 字节</text><text x="23" y="88" font-size="15" fill="#29433a" text-anchor="start" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">1000²</text><rect x="130" y="66" width="5" height="30" rx="7" fill="#26786b" /><text x="545" y="88" font-size="16" fill="#d7834d" text-anchor="start" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">8 MB</text><text x="23" y="146" font-size="15" fill="#29433a" text-anchor="start" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">5000²</text><rect x="130" y="124" width="97.5" height="30" rx="7" fill="#26786b" /><text x="545" y="146" font-size="16" fill="#d7834d" text-anchor="start" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">200 MB</text><text x="23" y="204" font-size="15" fill="#29433a" text-anchor="start" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">10000²</text><rect x="130" y="182" width="390" height="30" rx="7" fill="#26786b" /><text x="545" y="204" font-size="16" fill="#d7834d" text-anchor="start" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">800 MB</text></svg>