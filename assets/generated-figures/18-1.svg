<svg width="640" height="260" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-label="这是固定端点的动态 OT 直觉。ChordEdit 的实际算法求局部代理方向，并未精确解出完整分布动态 OT。"><title>这是固定端点的动态 OT 直觉。ChordEdit 的实际算法求局部代理方向，并未精确解出完整分布动态 OT。</title><text x="320" y="25" font-size="17" fill="#29433a" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif">相同起终点，弯路需要更高的平方速度积分</text><path d="M55 180L585 180" stroke="#26786b" stroke-width="4"/><path d="M55 180C180 15 400 15 585 180" stroke="#d7834d" stroke-width="4" fill="none"/><text x="320" y="207" font-size="16" fill="#26786b" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif">直线路径：速度保持一致</text><text x="320" y="83" font-size="16" fill="#d7834d" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif">偏离后再回来：移动更大</text><text x="60" y="239" font-size="16" fill="#29433a" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif">源</text><text x="585" y="239" font-size="16" fill="#29433a" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif">目标</text></svg>