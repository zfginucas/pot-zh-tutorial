<svg width="640" height="260" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-label="一次批量调用不等于一组条件求值。作者称“prox”的增强步骤，不应自动解释为严格近端优化算子的闭式解。"><title>一次批量调用不等于一组条件求值。作者称“prox”的增强步骤，不应自动解释为严格近端优化算子的闭式解。</title><text x="320" y="25" font-size="17" fill="#29433a" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif">一次运输更新，与可选语义增强分别计费</text><rect x="20" y="55" width="185" height="110" rx="8" fill="#e8f0e4"/><rect x="235" y="55" width="180" height="110" rx="8" fill="#e8f0e4"/><rect x="445" y="55" width="175" height="110" rx="8" fill="#e8f0e4"/><text x="112" y="86" font-size="16" fill="#29433a" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif">四组查询打包</text><text x="112" y="123" font-size="16" fill="#26786b" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif">1 次批量 UNet</text><text x="325" y="86" font-size="15" fill="#29433a" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif">xpred=xsrc+λû</text><text x="325" y="123" font-size="16" fill="#26786b" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif">运输更新 1 次</text><text x="532" y="86" font-size="15" fill="#29433a" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif">可选 predict-x₀</text><text x="532" y="123" font-size="15" fill="#d7834d" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif">再一次网络调用</text><path d="M208 109L230 109" stroke="#26786b" stroke-width="3" fill="none"/><circle cx="230" cy="109" r="5" fill="#26786b"/><path d="M420 109L440 109" stroke="#26786b" stroke-width="3" fill="none"/><circle cx="440" cy="109" r="5" fill="#26786b"/><text x="320" y="225" font-size="16" fill="#29433a" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif">论文默认含增强：报告 NFE=2；仅运输：NFE=1</text></svg>