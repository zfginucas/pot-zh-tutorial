<svg width="760" height="350" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="按上一图的两个最优置换构造线性路径，对应论文式 (9)、(10) 与算法 1。交叉位置的速度依赖条件对，不能只画无条件速度场。"><line x1="55" y1="247" x2="350" y2="247" stroke="#ccd8cc" stroke-width="1.5"/><line x1="55" y1="247" x2="55" y2="82" stroke="#ccd8cc" stroke-width="1.5"/><text x="202.5" y="278" text-anchor="middle" font-size="13" fill="#61796d" font-family="Segoe UI,Microsoft YaHei,sans-serif">路径时间 t</text><text x="51" y="67" text-anchor="start" font-size="13" fill="#61796d" font-family="Segoe UI,Microsoft YaHei,sans-serif">状态 x</text><text x="202.5" y="36" text-anchor="middle" font-size="15" fill="#24796b" font-family="Segoe UI,Microsoft YaHei,sans-serif">β=1：同条件静止</text><line x1="55" y1="247" x2="350" y2="247" stroke="#24796b" stroke-width="3"/><polyline points="342.10175694298664,251.31482984743784 350,247 342.10175694298664,242.68517015256216" stroke="#24796b" stroke-width="3" fill="none"/><circle cx="202.5" cy="247" r="5" fill="#24796b"/><line x1="55" y1="82" x2="350" y2="82" stroke="#cf7845" stroke-width="3"/><polyline points="342.10175694298664,86.31482984743782 350,82 342.10175694298664,77.68517015256218" stroke="#cf7845" stroke-width="3" fill="none"/><circle cx="202.5" cy="82" r="5" fill="#cf7845"/><text x="202.5" y="296" text-anchor="middle" font-size="12" fill="#243e38" font-family="Segoe UI,Microsoft YaHei,sans-serif">目标速度都是 0；条件对为 0→0、1→1</text><line x1="420" y1="247" x2="715" y2="247" stroke="#ccd8cc" stroke-width="1.5"/><line x1="420" y1="247" x2="420" y2="82" stroke="#ccd8cc" stroke-width="1.5"/><text x="567.5" y="278" text-anchor="middle" font-size="13" fill="#61796d" font-family="Segoe UI,Microsoft YaHei,sans-serif">路径时间 t</text><text x="416" y="67" text-anchor="start" font-size="13" fill="#61796d" font-family="Segoe UI,Microsoft YaHei,sans-serif">状态 x</text><text x="567.5" y="36" text-anchor="middle" font-size="15" fill="#cf7845" font-family="Segoe UI,Microsoft YaHei,sans-serif">β=6：跨条件路径</text><line x1="420" y1="247" x2="715" y2="82" stroke="#24796b" stroke-width="3"/><polyline points="710.213040562888,89.621352855461 715,82 706.0004474851778,82.08974704985815" stroke="#24796b" stroke-width="3" fill="none"/><circle cx="567.5" cy="164.5" r="5" fill="#24796b"/><line x1="420" y1="82" x2="715" y2="247" stroke="#cf7845" stroke-width="3"/><polyline points="706.0004474851778,246.91025295014185 715,247 710.213040562888,239.378647144539" stroke="#cf7845" stroke-width="3" fill="none"/><circle cx="567.5" cy="164.5" r="5" fill="#cf7845"/><text x="567.5" y="296" text-anchor="middle" font-size="12" fill="#243e38" font-family="Segoe UI,Microsoft YaHei,sans-serif">同在 x=1.5，但目标速度分别 +3、−3</text><text x="380" y="331" text-anchor="middle" font-size="13" fill="#61796d" font-family="Segoe UI,Microsoft YaHei,sans-serif">vθ 必须接收 (x,t,c₁,c₂)，才能区分交叉位置上的不同目标速度。</text></svg>