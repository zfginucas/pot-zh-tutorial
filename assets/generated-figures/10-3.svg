<svg width="640" height="267" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 267" role="img" aria-label="这是 POT 的 α 约定。条形长度表示系数，不代表两个损失实际贡献的比例；若结构项数值大一个数量级，α=0.5 也未必实现数值上的“各占一半”。"><title>这是 POT 的 α 约定。条形长度表示系数，不代表两个损失实际贡献的比例；若结构项数值大一个数量级，α=0.5 也未必实现数值上的“各占一半”。</title><text x="320" y="28" font-size="16" fill="#29433a" text-anchor="middle" font-weight="600" font-family="Segoe UI,Microsoft YaHei,sans-serif">FGW = (1−α) × 特征项 + α × 结构项</text><text x="95" y="90" font-size="16" fill="#29433a" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">α = 0</text><rect x="175" y="66" width="385" height="36" rx="7" fill="#d7834d" /><text x="368" y="90" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">只比较可比特征</text><text x="95" y="152" font-size="16" fill="#29433a" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">α = 0.5</text><rect x="175" y="128" width="192.5" height="36" rx="7" fill="#d7834d" /><rect x="367.5" y="128" width="192.5" height="36" rx="7" fill="#26786b" /><text x="368" y="152" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">两项各取一半权重</text><text x="95" y="214" font-size="16" fill="#29433a" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">α = 1</text><rect x="175" y="190" width="385" height="36" rx="7" fill="#26786b" /><text x="368" y="214" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="400" font-family="Segoe UI,Microsoft YaHei,sans-serif">只比较内部结构</text></svg>